name: Daily Japan News Summarizer

on:
  schedule:
    # 毎日 UTC 21:30（日本時間 JST 朝 6:30）に自動実行
    - cron: '30 21 * * *'
  # GitHubのWeb画面から手動でいつでも実行可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 海外ニュースの収集とGemini要約の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_and_summarize.py

      - name: 変更をコミットしてプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "Auto-update: Japan news digest $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
